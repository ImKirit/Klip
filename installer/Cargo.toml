[package]
name = "klip-setup"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
klip-core = { path = "../crates/klip-core" }
klip-tray = { path = "../crates/klip-tray" }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
