[package]
name = "klip-input"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    # WNDCLASSW has a brush field, the window class type is gated behind Gdi.
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Input",
    # Only for examples/capture.rs: GetLastInputInfo tells whether the machine saw any
    # input during the run, so "0 events" can be told apart from "nobody was there".
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
