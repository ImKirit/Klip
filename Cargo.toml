[workspace]
resolver = "2"
members = ["crates/*", "recorder", "installer"]
exclude = ["app/src-tauri"]

[workspace.package]
version = "1.0.0-beta.1"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
